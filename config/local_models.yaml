# Locally executed models.
#
# This is a separate track from config/models.yaml, which stays OpenRouter-only.
# A local engine is not a second API vendor: nothing is billed, so cost columns
# are empty rather than zero, and the reports mark these rows as local.
#
# Only the classification benchmark supports local execution today. The engine
# is constrained to the frozen 60-intent label space by a GBNF grammar, so an
# unparseable answer is impossible by construction -- the same guarantee the
# hosted `--classification-mode json_schema` buys from the provider.
version: 1

# Two entries share the same weights and differ only in how the answer is
# produced, so the decoding strategy can be measured on its own.
models:
  - model_id: local/qwen2.5-1.5b-instruct-q8-gguf-pcd
    display_name: Qwen2.5 1.5B Q8 - parallel constrained decoding
    vendor: qwen
    provider: local
    enabled: true
    # Prefill once, slice the logits to the candidate set, walk a token tree for
    # candidates sharing a prefix. Nothing is generated: the answer is read out
    # of the logits, with a calibrated probability.
    engine: llama_cpp_pcd
    # Bump when the decoding algorithm changes, so results are never pooled
    # across two different implementations.
    algorithm_version: "pcd-2"
    source:
      repo: Qwen/Qwen2.5-1.5B-Instruct-GGUF
      filename: qwen2.5-1.5b-instruct-q8_0.gguf
      revision: 91cad51170dc346986eccefdc2dd33a9da36ead9
    runtime:
      n_ctx: 4096
      n_threads: 8
      n_gpu_layers: 0
      n_batch: 512
      seed: 0
      temperature: 0.0
      top_p: 1.0
      max_label_tokens: 32
      # KV sequences for broadcasting tree branches. Throughput only: running out
      # raises rather than truncating the search.
      n_seq_max: 32

  - model_id: local/qwen2.5-1.5b-instruct-q8-gguf
    display_name: Qwen2.5 1.5B Q8 - grammar-guided generation (baseline)
    vendor: qwen
    provider: local
    enabled: true
    engine: llama_cpp
    source:
      repo: Qwen/Qwen2.5-1.5B-Instruct-GGUF
      filename: qwen2.5-1.5b-instruct-q8_0.gguf
      # Pinned like every dataset in this project: the weights are part of the
      # benchmark's identity, and they are hashed into the inference cache key.
      revision: 91cad51170dc346986eccefdc2dd33a9da36ead9
    runtime:
      n_ctx: 4096
      # Pinned rather than null: llama.cpp otherwise picks a thread count from
      # machine load, and the reduction order that follows makes results drift
      # slightly between runs (measured: 3 of 1,000 answers changed).
      n_threads: 8
      # How many of the model's 28 layers run on the GPU. 0 = CPU only.
      #
      # This is NOT just a speed knob: the CUDA and CPU kernels disagree on about
      # 1.2% of answers (240 sampled utterances, 3 differed), so it is part of the
      # inference cache key and changing it re-runs the benchmark.
      #
      # 0 keeps both entries on the same backend so the decoding comparison is
      # not confounded by it. Raise it (20 fits a 4 GB card with ~1.9 GB free,
      # ~3x faster) once you are comparing models rather than decoders.
      # llama.cpp aborts the process if the weights do not fit, so it fails
      # loudly rather than silently falling back.
      n_gpu_layers: 0
      n_batch: 512
      seed: 0
      temperature: 0.0
      top_p: 1.0
      max_label_tokens: 32

  - model_id: local/qwen3.5-2b-q8-gguf
    display_name: Qwen3.5 2B (GGUF Q8_0, local)
    vendor: qwen
    provider: local
    enabled: true
    engine: llama_cpp_pcd
    algorithm_version: "pcd-2"
    source:
      repo: unsloth/Qwen3.5-2B-GGUF
      filename: Qwen3.5-2B-Q8_0.gguf
      revision: f6d5376be1edb4d416d56da11e5397a961aca8ae
    runtime:
      n_ctx: 4096
      n_threads: 8
      n_gpu_layers: 0
      n_batch: 512
      seed: 0
      temperature: 0.0
      top_p: 1.0
      max_label_tokens: 32
      n_seq_max: 32

  - model_id: local/qwen3.5-4b-q4km-gguf
    display_name: Qwen3.5 4B (GGUF Q4_K_M, local)
    vendor: qwen
    provider: local
    enabled: true
    engine: llama_cpp_pcd
    algorithm_version: "pcd-2"
    source:
      repo: unsloth/Qwen3.5-4B-GGUF
      filename: Qwen3.5-4B-Q4_K_M.gguf
      revision: e87f176479d0855a907a41277aca2f8ee7a09523
    runtime:
      n_ctx: 4096
      n_threads: 8
      n_gpu_layers: 0
      n_batch: 512
      seed: 0
      temperature: 0.0
      top_p: 1.0
      max_label_tokens: 32
      n_seq_max: 32
