# Benchmark target models.
#
# Every model is called through OpenRouter and nothing else: `provider` MUST be
# `openrouter` for every entry. Adding a new model = adding one block here
# (+ a pricing entry in config/pricing.yaml) -- no code change required.
#
# Prices do NOT live in this file. See config/pricing.yaml.
version: 1

defaults:
  provider: openrouter
  enabled: true
  max_output_tokens: 1024
  reasoning:
    enabled: false      # thinking disabled for the default benchmark
    effort: null        # "low" | "medium" | "high" (only when enabled)
    max_tokens: null
  # Which request parameters the model accepts, per OpenRouter's
  # `supported_parameters`. With routing.require_parameters: true, sending an
  # unsupported parameter makes OpenRouter answer HTTP 404 "No endpoints found
  # that can handle the requested parameters", so unsupported ones are omitted.
  # `benchmark models --check` compares these flags against OpenRouter's live
  # metadata, and `benchmark run` refuses to start on a mismatch.
  parameters:
    temperature: true
    top_p: true
    seed: true
    stop: true
    reasoning: true
    response_format: true
    # Strict `json_schema` responses are a separate capability: an endpoint can
    # accept response_format while rejecting a schema.
    structured_outputs: true
  routing:
    mode: default              # default | pinned | restricted
    provider_order: null       # e.g. ["deepinfra", "together"]
    allow_fallbacks: true
    only: null                 # restrict to these upstream providers
    ignore: null               # never route to these upstream providers
    require_parameters: true   # drop endpoints that silently ignore temperature/max_tokens
    data_collection: allow     # allow | deny
    sort: null                 # price | throughput | latency
    quantizations: null

models:
  - model_id: openai/gpt-5.6-luna
    display_name: GPT-5.6 Luna
    vendor: openai
    enabled: true
    max_output_tokens: 1024
    reasoning:
      enabled: false
    parameters:
      temperature: false   # OpenRouter reports no temperature support
      top_p: false
      stop: false
    routing:
      mode: default
      provider_order: null
      allow_fallbacks: true

