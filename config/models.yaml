  - model_id: openai/gpt-5-nano
    display_name: GPT-5 Nano
    vendor: openai
    enabled: true
    # This endpoint refuses to run with thinking disabled ("Reasoning is
    # mandatory for this endpoint and cannot be disabled"), so it runs at the
    # lowest effort instead. Reasoning tokens count against max_tokens, hence the
    # headroom and the raised ceiling.
    max_output_tokens: 4096
    reasoning:
      enabled: true
      effort: low
      output_token_headroom: 2048
      estimated_output_tokens: 256
    parameters:
      temperature: false   # OpenRouter reports no temperature support
