# Fallback / estimate pricing, in USD per 1,000,000 tokens.
#
# These numbers are ONLY used for:
#   * pre-run budget estimation (`benchmark estimate`, `--dry-run`)
#   * validation of the cost OpenRouter reports
# They are NEVER the authoritative cost. The authoritative cost of a request is
# `usage.cost` from the OpenRouter response (see config/benchmark.yaml -> cost).
#
# `benchmark pricing` refreshes a snapshot from the OpenRouter /models endpoint;
# these values are the offline fallback when that call fails.
version: 1
currency: USD
source: config

# Eligibility gate for the "default" cheap-model benchmark.
constraints:
  max_input_per_million: 0.25
  max_output_per_million: 1.50

models:
